[project]
name = "flightkit"
version = "0.1.0"
description = "Orchestration SDK over flight-price APIs: fan-out, caching, confidence fallback."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Angelos Zaimis", email = "182300626+Angelos-Zaimis@users.noreply.github.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=1.0"]
all = ["flightkit[api,mcp]"]

[project.scripts]
flightkit-mcp = "flightkit.entrypoints.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.11",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
packages = ["flightkit"]
mypy_path = "src"

# Optional extras may be missing in the base environment.
[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["flightkit.entrypoints.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
