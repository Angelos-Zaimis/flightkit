name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flightkit
          POSTGRES_PASSWORD: flightkit
          POSTGRES_DB: flightkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint check
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Dependency vulnerability scan
        run: uv run pip-audit

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://flightkit:flightkit@localhost:5432/flightkit
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: ci-only-throwaway-secret
          APP_NAME: Flightkit
          ENVIRONMENT: test
          DEBUG: "true"
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: uv run pytest -v
