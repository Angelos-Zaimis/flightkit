name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Base install only: proves the library works without any extras.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint check
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -v

  # All extras installed: checks the FastAPI / MCP entrypoints.
  test-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --python 3.12 --extra all

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: >-
          uv run pytest -v
          --deselect tests/test_architecture.py::test_base_install_has_no_optional_deps

  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --extra all

      - name: Dependency vulnerability scan
        run: uv run pip-audit --skip-editable

      - name: Build sdist and wheel
        run: uv build
